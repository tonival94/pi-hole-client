name: Codegen and tests (temporary)
on:
  push:
    branches: ['cg/**']
permissions:
  contents: write
jobs:
  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.47.9
      - run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev
      - run: cp .env.sample .env
      - run: flutter pub get
      - run: dart run tools/generate_git_commit.dart
      - name: Generate code and format
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          dart format lib test
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lib test
          git reset -q lib/build_info 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: generated code [codegen]"
            git push
          fi
      - name: Analyze
        run: flutter analyze lib test
      - name: Tests
        run: |
          dart run full_coverage || true
          flutter test --coverage --concurrency=4
      - name: Patch coverage
        if: always()
        run: python3 .github/patchcov.py b3c0655
      - name: Widget unit tests (Android)
        if: always()
        working-directory: android
        run: |
          cd .. && flutter build apk --debug --target-platform android-arm64 && cd android
          ./gradlew -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=2g" :app:testDebugUnitTest --tests "io.github.tsutsu3.pi_hole_client.widget.*"
