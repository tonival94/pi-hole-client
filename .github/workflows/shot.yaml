name: Shot (temporary)
on:
  push:
    branches: ['cg/shot']
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          flutter-version: 3.47.9
      - run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev
      - run: cp .env.sample .env
      - run: flutter pub get
      - run: dart run tools/generate_git_commit.dart
      - run: ls $FLUTTER_ROOT/bin/cache/artifacts/material_fonts | head -50
      - run: flutter test --update-goldens test/_shot/shot_test.dart
      - run: flutter test test/ui/settings/app_settings/advanced_settings/disable_timers_screen_test.dart
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f test/_shot/*.png
          git commit -m "shots [codegen]" && git push
